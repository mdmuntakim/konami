name: Build Konami ID Release APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./konami-app

    steps:
      - name: ⭐ Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 🛠️ Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 33
          ndk-level: 25

      - name: 📜 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🔨 Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon 2>&1 | tail -5

      - name: 📁 Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: konami-id-release-apk
          path: konami-app/build/outputs/apk/release/*.apk

      - name: 🏷️ Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.run_number }}
          name: "Konami ID Release #${{ github.run_number }}"
          files: konami-app/build/outputs/apk/release/*.apk
          generate_release_notes: false
          fail_on_unmatched_files: false

      - name: 📤 Push to GitHub remote
        env:
          GIT_AUTHOR_NAME: "Konami ID Bot"
          GIT_AUTHOR_EMAIL: "bot@konami.id"
          GIT_COMMITTER_NAME: "Konami ID Bot"
          GIT_COMMITTER_EMAIL: "bot@konami.id"
        run: |
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://github.com/mdmuntakim/konami.git"
          git push -u origin main