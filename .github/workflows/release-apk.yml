name: Build Konami ID Release APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: ⭐ Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 🛠️ Install Android SDK Command-line Tools
        run: |
          set -e
          CMDL_DIR="$HOME/android/cmdline-tools/latest"
          mkdir -p "$CMDL_DIR"
          CD_URL="https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip"
          cd "$CMDL_DIR"
          curl -sL "$CD_URL" -o cmdline-tools.zip
          unzip -q cmdline-tools.zip
          for d in */; do [ -d "$d" ] && mv "$d" cmdline-tools && break; done 2>/dev/null
          echo y | "$cmdline-tools/bin/sdkmanager" --install "platforms;android-33" 2>&1 | tail -3
          echo y | "$cmdline-tools/bin/sdkmanager" --install "build-tools;33.0.2" 2>&1 | tail -3
          export ANDROID_CMDLINE_TOOLS="$cmdline-tools"
          echo "ANDROID_CMDLINE_TOOLS=$cmdline-tools" >> $GITHUB_ENV

      - name: 📜 Accept SDK Licenses
        run: |
          export ANDROID_CMDLINE_TOOLS
          echo y | "$ANDROID_CMDLINE_TOOLS/bin/sdkmanager" --licenses 2>&1 | tail -5

      - name: 🔨 Build Release APK
        run: |
          chmod +x gradlew 2>/dev/null || true
          export ANDROID_CMDLINE_TOOLS
          ./gradlew assembleRelease --no-daemon 2>&1 | tail -10

      - name: 📁 Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: konami-id-release-apk
          path: build/outputs/apk/release/*.apk

      - name: 🏷️ Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.run_number }}
          name: "Konami ID Release #${{ github.run_number }}"
          files: build/outputs/apk/release/*.apk
          generate_release_notes: false
          fail_on_unmatched_files: false

      - name: 📤 Push to GitHub remote
        env:
          GIT_AUTHOR_NAME: "Konami ID Bot"
          GIT_AUTHOR_EMAIL: "bot@konami.id"
          GIT_COMMITTER_NAME: "Konami ID Bot"
          GIT_COMMITTER_EMAIL: "bot@konami.id"
        run: |
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://github.com/mdmuntakim/konami.git"
          git push -u origin main