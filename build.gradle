plugins {
    id 'com.android.application'
}

android {
    namespace 'com.konami.konamiid'
    compileSdk 33
    defaultConfig {
        applicationId 'com.konami.konamiid'
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
}